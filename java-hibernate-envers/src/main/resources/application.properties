server.port: 8080

spring.application.name=java-hibernate-envers

spring.datasource.url=jdbc:mysql://localhost:3306/WFM_ENVERS
spring.datasource.username=springstudent
spring.datasource.password=springstudent

spring.jpa.show-sql=true
spring.jpa.datasource=default
spring.jpa.generate-ddl=false

spring.jpa.hibernate=none
spring.jpa.ddl-auto=none

